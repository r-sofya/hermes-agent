#
# Optimized docker-compose.yml for Hermes Agent (Dokploy Compatible)
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The entrypoint remaps the internal `hermes` user to these values via
# usermod/groupmod + gosu.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep /opt/hermes/docker/entrypoint.sh in
#     the command chain. It drops root to the hermes user before gateway
#     files such as gateway.lock are created.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    # 🚨 Crucial Change 1: Remove network_mode: host to allow Traefik proxying.
    # Dokploy automatically connects this service to `dokploy-network`.
    expose:
      - "8642" # OpenAI-compatible API server port
      - "8765" # Telephony Voice TWiML HTTP port
      - "8766" # Telephony Voice Stream WebSocket port
    volumes:
      - hermes_data:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}

      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_POLL_INTERVAL=${EMAIL_POLL_INTERVAL}
      - EMAIL_ALLOWED_USERS=${EMAIL_ALLOWED_USERS}
      - EMAIL_HOME_ADDRESS=${EMAIL_HOME_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS}

      # To expose the OpenAI-compatible API server via Dokploy,
      # uncomment BOTH lines and create a domain mapping for port 8642 in Dokploy.
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    expose:
      - "9119" # Dashboard UI port
    ports:
      - "9119:9119" # Maps host 9119 -> container 9119 for direct IP access
    volumes:
      - hermes_data:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # 🚨 Crucial Change 2: Connect the Dashboard container to the Gateway via the bridge network.
      - GATEWAY_HEALTH_URL=http://gateway:8642

      # Dashboard Authentication (Required when binding to 0.0.0.0)
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD:-admin}
    # 🚨 Crucial Change 3: Bind to 0.0.0.0 (not 127.0.0.1) so Traefik can route traffic into the container.
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]

# 🚨 Crucial Change 4: Use a Named Volume for persistent data.
# This prevents host path ownership conflicts and guarantees data persistence across redeploys in Dokploy.
volumes:
  hermes_data:
